<section id="profile" class="page">
                <div class="glass-card" style="display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative;">
                    
                    <span class="close-btn" onclick="showPage('home', document.querySelector('.nav-item.active'))" style="position:absolute; top:20px; right:20px;">&times;</span>

                    <h2 class="section-title">My Profile</h2>
                    
                    <div id="profileLoginView" style="text-align:center; width:100%; max-width:400px;">
                        <div class="auth-toggle-box" style="margin-bottom:20px; display:flex; background:rgba(255,255,255,0.1); border-radius:30px; padding:5px;">
                            <div class="auth-toggle-btn active" id="btnSignIn" onclick="toggleProfileAuth('signin')" style="flex:1; padding:10px; cursor:pointer; border-radius:25px; text-align:center;">Sign In</div>
                            <div class="auth-toggle-btn" id="btnSignUp" onclick="toggleProfileAuth('signup')" style="flex:1; padding:10px; cursor:pointer; border-radius:25px; text-align:center;">Sign Up</div>
                        </div>

                        <div id="emailAuthForm">
                            <div class="input-group"><i class="fas fa-envelope"></i><input type="email" id="emailInput" placeholder="Email Address"></div>
                            <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="passInput" placeholder="Password"></div>
                            <button class="btn-primary full-width" id="actionBtn" onclick="handleEmailAuth()" style="margin-top:10px;">Login</button>
                        </div>

                        <p style="margin:20px 0; color:#aaa;">OR Login with</p>
                        <div class="social-login" style="display:flex; gap:10px; margin-top:0;">
                            <button class="social-btn google" onclick="googleLogin()" style="flex:1;"><img src="https://img.icons8.com/color/48/google-logo.png" style="width:20px;"> Google</button>
                            <button class="social-btn facebook" onclick="facebookLogin()" style="flex:1;"><img src="https://img.icons8.com/color/48/facebook-new.png" style="width:20px;"> Facebook</button>
                        </div>
                    </div>

                    <div id="profileEditView" style="display:none; width:100%; max-width:600px;">
                        
                        <div style="text-align:center; margin-bottom:20px;">
                            <img id="editProfilePic" src="" style="width:100px; height:100px; border-radius:50%; border:3px solid var(--primary); object-fit:cover;">
                            <p style="font-size:0.8rem; color:#aaa; margin-top:5px;">Select an Avatar below</p>
                            
                            <div class="avatar-selector">
                                <img src="https://img.icons8.com/color/96/user-male-circle--v1.png" onclick="selectAvatar(this.src)">
                                <img src="https://img.icons8.com/color/96/user-female-circle--v1.png" onclick="selectAvatar(this.src)">
                                <img src="https://img.icons8.com/color/96/person-female.png" onclick="selectAvatar(this.src)">
                                <img src="https://img.icons8.com/color/96/person-male.png" onclick="selectAvatar(this.src)">
                                <img src="https://img.icons8.com/fluency/96/hacker.png" onclick="selectAvatar(this.src)">
                            </div>
                        </div>

                        <div class="profile-form-grid">
                            <div class="input-group"><i class="fas fa-user"></i><input type="text" id="editUsername" placeholder="Full Name"></div>
                            
                            <div class="input-group">
                                <i class="fas fa-venus-mars"></i>
                                <select id="editGender" style="background:transparent; border:none; color:white; width:100%;">
                                    <option value="Male" style="color:black;">Male</option>
                                    <option value="Female" style="color:black;">Female</option>
                                </select>
                            </div>

                            <div class="input-group"><i class="fas fa-phone"></i><input type="text" id="editPhone" placeholder="Phone Number"></div>

                            <div style="display:flex; gap:10px;">
                                <div class="input-group"><i class="fas fa-city"></i><input type="text" id="editCity" placeholder="City"></div>
                                <div class="input-group"><i class="fas fa-globe"></i><input type="text" id="editCountry" placeholder="Country"></div>
                            </div>

                            <div class="input-group"><i class="fas fa-map-marker-alt"></i><input type="text" id="editAddress" placeholder="Address"></div>
                        </div>
                        
                        <button class="btn-primary full-width" onclick="saveProfile()" style="margin-top:15px;">Save Profile <i class="fas fa-save"></i></button>
                        <button class="btn-secondary full-width" onclick="googleLogout()" style="margin-top:10px; border-color:red; color:red;">Logout <i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
            </section>
