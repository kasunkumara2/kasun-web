<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasun Padma Kumara | Creative Creator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');

:root {
    --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    --glass-bg: rgba(255, 255, 255, 0.7);
    --glass-border: rgba(255, 255, 255, 0.3);
    --text-dark: #1a1a2e;
    --text-light: #6b7280;
    --bg-soft: #f8f7ff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: var(--bg-soft);
    color: var(--text-dark);
    overflow-x: hidden;
}

/* Animated Background */
.animated-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: 
        radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(120, 219, 255, 0.3) 0%, transparent 50%);
    filter: blur(80px);
    animation: bgMove 20s ease-in-out infinite;
}

@keyframes bgMove {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
}

/* Top Navigation */
.top-nav {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 20px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--glass-border);
    z-index: 1000;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
}

.logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.nav-links {
    display: flex;
    gap: 40px;
    list-style: none;
}

.nav-links a {
    text-decoration: none;
    color: var(--text-dark);
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.3s;
    position: relative;
}

.nav-links a::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 3px;
    background: var(--primary-gradient);
    border-radius: 10px;
    transition: width 0.3s;
}

.nav-links a:hover::after,
.nav-links a.active::after {
    width: 100%;
}

.nav-links a:hover {
    color: #667eea;
}

.nav-actions {
    display: flex;
    gap: 15px;
    align-items: center;
}

.icon-btn {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: none;
    background: white;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    font-size: 1.1rem;
    color: var(--text-dark);
}

.icon-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
}

/* Main Container */
.main-container {
    margin-top: 100px;
    padding: 0 50px;
    min-height: calc(100vh - 200px);
}

/* Hero Section */
.hero-section {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 80vh;
    gap: 60px;
}

.hero-content {
    flex: 1;
    max-width: 600px;
}

.hero-badge {
    display: inline-block;
    padding: 10px 25px;
    background: white;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 600;
    color: #667eea;
    margin-bottom: 25px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    animation: fadeInUp 0.8s ease;
}

.hero-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 4.5rem;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 20px;
    animation: fadeInUp 0.8s ease 0.1s both;
}

.hero-title span {
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.hero-subtitle {
    font-size: 1.4rem;
    color: var(--text-light);
    margin-bottom: 40px;
    animation: fadeInUp 0.8s ease 0.2s both;
}

.hero-stats {
    display: flex;
    gap: 40px;
    margin-bottom: 40px;
    animation: fadeInUp 0.8s ease 0.3s both;
}

.stat-box {
    text-align: center;
}

.stat-number {
    font-size: 2.5rem;
    font-weight: 800;
    background: var(--secondary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.stat-label {
    font-size: 0.9rem;
    color: var(--text-light);
    margin-top: 5px;
}

.hero-buttons {
    display: flex;
    gap: 20px;
    animation: fadeInUp 0.8s ease 0.4s both;
}

.btn-primary {
    padding: 16px 40px;
    background: var(--primary-gradient);
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 10px;
}

.btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
}

.btn-secondary {
    padding: 16px 40px;
    background: white;
    color: var(--text-dark);
    border: 2px solid rgba(102, 126, 234, 0.3);
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 10px;
}

.btn-secondary:hover {
    transform: translateY(-3px);
    border-color: #667eea;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
}

/* Hero Image */
.hero-visual {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    animation: fadeIn 1s ease 0.5s both;
}

.profile-container {
    position: relative;
    width: 450px;
    height: 450px;
}

.profile-glow {
    position: absolute;
    inset: -20px;
    background: var(--primary-gradient);
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.6;
    animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.05); opacity: 0.8; }
}

.profile-img-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: 5px solid white;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
}

.profile-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.floating-card {
    position: absolute;
    background: white;
    padding: 15px 25px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    animation: float 3s ease-in-out infinite;
}

.floating-card.card-1 {
    top: 50px;
    right: 0;
    animation-delay: 0s;
}

.floating-card.card-2 {
    bottom: 80px;
    left: -30px;
    animation-delay: 1.5s;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* Bottom Navigation */
.bottom-nav {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(20px);
    padding: 15px 40px;
    border-radius: 50px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    border: 1px solid var(--glass-border);
    z-index: 1000;
    display: flex;
    gap: 30px;
}

.bottom-nav a {
    text-decoration: none;
    color: var(--text-light);
    font-weight: 600;
    font-size: 0.9rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    transition: all 0.3s;
    padding: 10px 20px;
    border-radius: 15px;
}

.bottom-nav a i {
    font-size: 1.3rem;
}

.bottom-nav a:hover,
.bottom-nav a.active {
    color: #667eea;
    background: rgba(102, 126, 234, 0.1);
}

/* Animations */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Responsive */
@media (max-width: 1024px) {
    .hero-section {
        flex-direction: column;
        text-align: center;
    }
    
    .hero-content {
        max-width: 100%;
    }
    
    .hero-title {
        font-size: 3rem;
    }
    
    .hero-stats {
        justify-content: center;
    }
    
    .hero-buttons {
        justify-content: center;
    }
    
    .profile-container {
        width: 300px;
        height: 300px;
    }
    
    .top-nav {
        padding: 15px 30px;
    }
    
    .nav-links {
        display: none;
    }
    
    .main-container {
        padding: 0 30px;
        margin-top: 80px;
    }
}

@media (max-width: 768px) {
    .hero-title {
        font-size: 2.5rem;
    }
    
    .bottom-nav {
        bottom: 20px;
        padding: 12px 25px;
        gap: 20px;
    }
    
    .bottom-nav a {
        font-size: 0.8rem;
        padding: 8px 15px;
    }
    
    .bottom-nav a i {
        font-size: 1.1rem;
    }
}
</style>
</head>
<body>

<!-- Animated Background -->
<div class="animated-bg"></div>

<!-- Top Navigation -->
<nav class="top-nav">
    <div class="logo">Kasun.</div>
    <ul class="nav-links">
        <li><a href="#home" class="active">Home</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#news">News</a></li>
        <li><a href="#journey">Journey</a></li>
    </ul>
    <div class="nav-actions">
        <button class="icon-btn" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
        </button>
        <button class="icon-btn" onclick="openSettings()">
            <i class="fas fa-user"></i>
        </button>
    </div>
</nav>

<!-- Main Container -->
<div class="main-container">
    <!-- Hero Section -->
    <section class="hero-section" id="home">
        <div class="hero-content">
            <div class="hero-badge">
                <i class="fas fa-sparkles"></i> Available for Projects
            </div>
            <h1 class="hero-title">
                I'm <span>Kasun</span><br>
                Creative Creator
            </h1>
            <p class="hero-subtitle">
                I am a <span id="typingText">Video Editor</span>
            </p>
            
            <div class="hero-stats">
                <div class="stat-box">
                    <div class="stat-number" data-target="150">0</div>
                    <div class="stat-label">Projects</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" data-target="40">0</div>
                    <div class="stat-label">Clients</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" data-target="5">0</div>
                    <div class="stat-label">Years</div>
                </div>
            </div>
            
            <div class="hero-buttons">
                <button class="btn-primary" onclick="openBooking()">
                    <i class="fas fa-rocket"></i>
                    Start Project
                </button>
                <a href="https://wa.me/+94717647693" class="btn-secondary">
                    <i class="fab fa-whatsapp"></i>
                    WhatsApp
                </a>
            </div>
        </div>
        
        <div class="hero-visual">
            <div class="profile-container">
                <div class="profile-glow"></div>
                <div class="profile-img-wrapper">
                    <img src="https://img.icons8.com/color/96/user.png" alt="Kasun">
                </div>
                <div class="floating-card card-1">
                    <i class="fas fa-video" style="color: #667eea;"></i>
                    <span>Video Editor</span>
                </div>
                <div class="floating-card card-2">
                    <i class="fas fa-camera" style="color: #f5576c;"></i>
                    <span>Photographer</span>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
    <a href="#home" class="active">
        <i class="fas fa-home"></i>
        <span>Home</span>
    </a>
    <a href="#skills">
        <i class="fas fa-chart-bar"></i>
        <span>Skills</span>
    </a>
    <a href="#gallery">
        <i class="fas fa-images"></i>
        <span>Gallery</span>
    </a>
    <a href="#chat">
        <i class="fas fa-comments"></i>
        <span>Chat</span>
    </a>
    <a href="#settings">
        <i class="fas fa-cog"></i>
        <span>Settings</span>
    </a>
</nav>

<script>
// Typing Effect
const words = ["Video Editor", "Photographer", "AI Artist", "Graphic Designer"];
let wordIndex = 0;
let charIndex = 0;
let isDeleting = false;
const typingElement = document.getElementById('typingText');

function type() {
    const currentWord = words[wordIndex];
    
    if (isDeleting) {
        typingElement.textContent = currentWord.substring(0, charIndex - 1);
        charIndex--;
    } else {
        typingElement.textContent = currentWord.substring(0, charIndex + 1);
        charIndex++;
    }
    
    let typeSpeed = isDeleting ? 50 : 100;
    
    if (!isDeleting && charIndex === currentWord.length) {
        typeSpeed = 2000;
        isDeleting = true;
    } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        wordIndex = (wordIndex + 1) % words.length;
        typeSpeed = 500;
    }
    
    setTimeout(type, typeSpeed);
}

// Counter Animation
function animateCounters() {
    const counters = document.querySelectorAll('.stat-number');
    counters.forEach(counter => {
        const target = +counter.getAttribute('data-target');
        const increment = target / 50;
        let current = 0;
        
        const updateCounter = () => {
            if (current < target) {
                current += increment;
                counter.textContent = Math.ceil(current);
                setTimeout(updateCounter, 30);
            } else {
                counter.textContent = target + "+";
            }
        };
        
        updateCounter();
    });
}

// Run animations on load
window.addEventListener('load', () => {
    type();
    setTimeout(animateCounters, 500);
});

// Placeholder functions
function toggleTheme() {
    alert('Theme toggle coming soon!');
}

function openSettings() {
    alert('Settings modal coming soon!');
}

function openBooking() {
    window.open('https://wa.me/+94717647693?text=Hi Kasun, I want to start a project', '_blank');
}

// Smooth scroll for navigation
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
            target.scrollIntoView({ behavior: 'smooth' });
        }
    });
});
</script>

</body>
</html>
